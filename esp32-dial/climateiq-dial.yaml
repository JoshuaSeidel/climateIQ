# ClimateIQ Rotary Dial — ESPHome firmware
#
# Hardware: GrowCube 1.28" ESP32-S3 round knob display
#           (Elecrow CrowPanel 1.28" HMI rebrand: GC9A01 240x240 IPS, CST816 touch,
#            rotary encoder + push button, 16MB flash, octal PSRAM)
#
# Talks directly to the climateIQ backend REST API (port 8420):
#   GET  /api/v1/system/override      -> live state (temps arrive in your display unit)
#   POST /api/v1/system/override      -> set a manual hold {"temperature": X}
#   POST /api/v1/system/quick-action  -> {"action": "resume"} returns to schedule
#
# Controls:
#   Rotate        -> adjust target temp (sent automatically 2s after you stop turning)
#   Short press   -> send the pending target immediately
#   Long press 1s -> cancel hold / resume schedule
#
# Look is modeled on climate-cluster-card: dark instrument-cluster face, outer scale
# ring, mode-colored target arc, big center current temp with "Set:" readout below.

substitutions:
  name: climateiq-dial
  friendly_name: ClimateIQ Dial
  # Base URL of the climateIQ backend.
  # HA add-on mode: uvicorn binds 0.0.0.0:8099 with host_network, so use port 8099.
  # Standalone/docker mode: default port is 8420.
  climateiq_base_url: "http://homeassistant.local:8099"
  # Only needed if CLIMATEIQ_API_KEY is set on the backend; otherwise leave as-is
  # (the header is ignored when no key is configured server-side).
  climateiq_api_key: ""
  # Dial range/step in YOUR display unit (F shown; use e.g. 15/28/1 for Celsius)
  temp_min: "55"
  temp_max: "85"
  temp_step: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ClimateIQ-Dial"

captive_portal:

http_request:
  timeout: 5s
  verify_ssl: false

globals:
  - id: g_room_avg            # schedule zones' live sensor avg (the "room temp")
    type: float
    initial_value: "0"
  - id: g_all_zones_avg
    type: float
    initial_value: "0"
  - id: g_disp_target         # animated (displayed) setpoint, eases toward target
    type: float
    initial_value: "0"
  - id: g_disp_room           # animated (displayed) room temp
    type: float
    initial_value: "0"
  - id: g_target_temp        # thermostat setpoint reported by climateIQ
    type: float
    initial_value: "0"
  - id: g_schedule_target
    type: float
    initial_value: "0"
  - id: g_edit_temp          # value being dialed in
    type: float
    initial_value: "0"
  - id: g_editing            # true while the user is turning / a send is pending
    type: bool
    initial_value: "false"
  - id: g_hvac_action
    type: std::string
    initial_value: '""'
  - id: g_fan_mode
    type: std::string
    initial_value: '""'
  - id: g_hvac_mode
    type: std::string
    initial_value: '""'
  - id: g_override_active
    type: bool
    initial_value: "false"
  - id: g_online
    type: bool
    initial_value: "false"

spi:
  id: spi_bus
  clk_pin: GPIO10
  mosi_pin: GPIO11

display:
  - platform: mipi_spi
    model: GC9A01A
    id: round_display
    spi_id: spi_bus
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    # GPIO1 gates panel power on the CrowPanel/GrowCube 1.28" — without it the
    # screen stays black even though SPI init succeeds
    enable_pin: GPIO1
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO46
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: rotary_encoder
    id: dial_encoder
    pin_a: GPIO45
    pin_b: GPIO42
    resolution: 2
    internal: true
    on_clockwise:
      - script.execute:
          id: adjust_temp
          delta: ${temp_step}
    on_anticlockwise:
      - script.execute:
          id: adjust_temp
          delta: -${temp_step}

binary_sensor:
  - platform: gpio
    id: dial_button
    internal: true
    pin:
      number: GPIO41
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_multi_click:
      # Double press: toggle fan auto <-> on
      - timing:
          - ON for at most 400ms
          - OFF for at most 300ms
          - ON for at most 400ms
          - OFF for at least 100ms
        then:
          - script.execute: toggle_fan
      # Short press: send pending target now (or force a refresh if not editing)
      - timing:
          - ON for at most 800ms
          - OFF for at least 350ms
        then:
          - if:
              condition:
                lambda: return id(g_editing);
              then:
                - script.stop: send_override_debounced
                - script.execute: send_override
              else:
                - script.execute: poll_status
      # Long press: cancel hold, resume schedule
      - timing:
          - ON for at least 1s
        then:
          - script.execute: resume_schedule

interval:
  # 25 fps animation tick: eases the arcs toward their new values and drives
  # the glow/shimmer while the HVAC runs (climate-cluster-card "Breeze")
  - interval: 40ms
    then:
      - lambda: |-
          float tgt = id(g_editing) ? id(g_edit_temp)
                    : (id(g_schedule_target) > 0 ? id(g_schedule_target) : id(g_target_temp));
          float room = id(g_room_avg) > 0 ? id(g_room_avg) : id(g_all_zones_avg);
          bool active = id(g_editing) || id(g_hvac_action) == "heating" || id(g_hvac_action) == "cooling";
          bool moving = false;
          if (tgt > 0) {
            if (id(g_disp_target) <= 0) id(g_disp_target) = tgt;             // first data: snap
            else if (fabsf(id(g_disp_target) - tgt) > 0.02f) {
              id(g_disp_target) += (tgt - id(g_disp_target)) * 0.18f;        // ease-out sweep
              moving = true;
            }
          }
          if (room > 0) {
            if (id(g_disp_room) <= 0) id(g_disp_room) = room;
            else if (fabsf(id(g_disp_room) - room) > 0.02f) {
              id(g_disp_room) += (room - id(g_disp_room)) * 0.18f;
              moving = true;
            }
          }
          if (active || moving) id(draw_gauge).execute();
  - interval: 10s
    then:
      - if:
          condition:
            not:
              script.is_running: send_override_debounced
          then:
            - script.execute: poll_status

script:
  # ---- rotate handling -------------------------------------------------------
  - id: adjust_temp
    parameters:
      delta: float
    then:
      - lambda: |-
          if (!id(g_editing)) {
            // seed the edit value from what the schedule wants (fall back to setpoint)
            float seed = id(g_schedule_target) > 0 ? id(g_schedule_target) : id(g_target_temp);
            if (seed <= 0) seed = (${temp_min} + ${temp_max}) / 2.0f;
            id(g_edit_temp) = seed;
            id(g_editing) = true;
          }
          id(g_edit_temp) = clamp(id(g_edit_temp) + delta, (float) ${temp_min}, (float) ${temp_max});
      - script.execute: refresh_ui
      - script.stop: send_override_debounced
      - script.execute: send_override_debounced

  - id: send_override_debounced
    mode: restart
    then:
      - delay: 2s
      - script.execute: send_override

  # ---- API calls -------------------------------------------------------------
  - id: send_override
    then:
      - http_request.post:
          url: ${climateiq_base_url}/api/v1/system/override
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${climateiq_api_key}"
          body: !lambda |-
            char buf[48];
            snprintf(buf, sizeof(buf), "{\"temperature\": %.1f}", id(g_edit_temp));
            return std::string(buf);
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("dial", "Override set to %.1f", id(g_edit_temp));
                    id(g_target_temp) = id(g_edit_temp);
                    id(g_override_active) = true;
                  } else {
                    ESP_LOGW("dial", "Override failed: HTTP %d", response->status_code);
                  }
                  id(g_editing) = false;
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("dial", "Override request error");
                  id(g_editing) = false;
                  id(g_online) = false;
      - script.execute: refresh_ui
      - script.execute: poll_status

  - id: toggle_fan
    then:
      - http_request.post:
          url: ${climateiq_base_url}/api/v1/system/fan
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${climateiq_api_key}"
          body: !lambda |-
            const char* next = id(g_fan_mode) == "on" ? "auto" : "on";
            return std::string("{\"mode\": \"") + next + "\"}";
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(g_fan_mode) = id(g_fan_mode) == "on" ? "auto" : "on";
                    ESP_LOGI("dial", "Fan mode -> %s", id(g_fan_mode).c_str());
                  } else {
                    ESP_LOGW("dial", "Fan toggle failed: HTTP %d", response->status_code);
                  }
      - script.execute: refresh_ui

  - id: resume_schedule
    then:
      - lambda: id(g_editing) = false;
      - script.stop: send_override_debounced
      - http_request.post:
          url: ${climateiq_base_url}/api/v1/system/quick-action
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${climateiq_api_key}"
          body: '{"action": "resume"}'
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("dial", "Resumed schedule");
                    id(g_override_active) = false;
                  }
      - script.execute: poll_status

  - id: poll_status
    mode: queued
    then:
      - http_request.get:
          url: ${climateiq_base_url}/api/v1/system/override
          request_headers:
            Authorization: "Bearer ${climateiq_api_key}"
          capture_response: true
          max_response_buffer_size: 2kB
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    id(g_online) = false;
                    return;
                  }
                  id(g_online) = true;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["schedule_avg_temp"].isNull())
                      id(g_room_avg) = root["schedule_avg_temp"].as<float>();
                    if (!root["all_zones_avg_temp"].isNull())
                      id(g_all_zones_avg) = root["all_zones_avg_temp"].as<float>();
                    if (!root["target_temp"].isNull())
                      id(g_target_temp) = root["target_temp"].as<float>();
                    if (!root["schedule_target_temp"].isNull())
                      id(g_schedule_target) = root["schedule_target_temp"].as<float>();
                    id(g_fan_mode)    = root["fan_mode"].isNull() ? "" : std::string(root["fan_mode"].as<const char*>());
                    id(g_hvac_mode)   = root["hvac_mode"].isNull()   ? "" : std::string(root["hvac_mode"].as<const char*>());
                    id(g_hvac_action) = root["hvac_action"].isNull() ? "" : std::string(root["hvac_action"].as<const char*>());
                    id(g_override_active) = !root["is_override_active"].isNull() && root["is_override_active"].as<bool>();
                    return true;
                  });
          on_error:
            then:
              - lambda: id(g_online) = false;
      - script.execute: refresh_ui

  # ---- render ---------------------------------------------------------------
  - id: refresh_ui
    then:
      - lambda: |-
          std::string action = id(g_hvac_action);
          std::string mode = id(g_hvac_mode);
          lv_color_t mode_color;
          const char* mode_word;
          if      (mode == "cool")      { mode_color = lv_color_hex(0x27D3FF); mode_word = "COOL"; }
          else if (mode == "heat")      { mode_color = lv_color_hex(0xFF9A2E); mode_word = "HEAT"; }
          else if (mode == "heat_cool") { mode_color = lv_color_hex(0x7EE787); mode_word = "HEAT/COOL"; }
          else if (mode == "dry")       { mode_color = lv_color_hex(0x2FE0C4); mode_word = "DRY"; }
          else if (mode == "fan_only")  { mode_color = lv_color_hex(0xEEF3F8); mode_word = "FAN"; }
          else if (mode == "auto")      { mode_color = lv_color_hex(0xFFDC5A); mode_word = "AUTO"; }
          else if (mode == "off")       { mode_color = lv_color_hex(0x6A7480); mode_word = "OFF"; }
          else                          { mode_color = lv_color_hex(0x8B95A2); mode_word = ""; }
          lv_color_t accent = id(g_editing) ? lv_color_hex(0xFFD54F) : mode_color;

          float shown_target = id(g_editing) ? id(g_edit_temp)
                             : (id(g_schedule_target) > 0 ? id(g_schedule_target) : id(g_target_temp));
          float room = id(g_room_avg) > 0 ? id(g_room_avg) : id(g_all_zones_avg);

          if (id(g_online)) {
            lv_label_set_text_fmt(id(set_big), "%.0f", shown_target);
            lv_label_set_text(id(mode_word_label), id(g_editing) ? "SET" : mode_word);
            lv_obj_set_style_text_color(id(mode_word_label), accent, 0);
            std::string status;
            if (id(g_editing))               status = "TURN TO SET";
            else if (action == "heating")    status = "\xE2\x97\x8F HEATING";
            else if (action == "cooling")    status = "\xE2\x97\x8F COOLING";
            else if (mode == "off")          status = "OFF";
            else if (id(g_override_active))  status = "HOLD";
            else                             status = "IDLE";
            lv_label_set_text(id(status_label), status.c_str());
            lv_obj_set_style_text_color(id(status_label), accent, 0);
            if (room > 0) lv_label_set_text_fmt(id(room_label), "ROOM %.1f\xC2\xB0", room);
            else          lv_label_set_text(id(room_label), "ROOM --");
            std::string fan = id(g_fan_mode);
            if (fan.empty()) {
              lv_label_set_text(id(fan_label), "");
            } else {
              bool fan_on = fan == "on";
              lv_label_set_text_fmt(id(fan_label), "FAN %s", fan_on ? "ON" : "AUTO");
              lv_obj_set_style_text_color(id(fan_label),
                  fan_on ? lv_color_hex(0x27D3FF) : lv_color_hex(0x6A7480), 0);
            }
          } else {
            lv_label_set_text(id(set_big), "--");
            lv_label_set_text(id(mode_word_label), "");
            lv_label_set_text(id(status_label), "OFFLINE");
            lv_obj_set_style_text_color(id(status_label), lv_color_hex(0xEF5350), 0);
            lv_label_set_text(id(room_label), "");
            lv_label_set_text(id(fan_label), "");
          }
      - script.execute: draw_gauge

  # Hand-rendered gauge on a canvas: gradient arcs with glow, ticks, room
  # pointer and shimmer — the parts of climate-cluster-card plain LVGL
  # widgets can't do.
  - id: draw_gauge
    then:
      - lambda: |-
          static constexpr float T_MIN = ${temp_min}, T_MAX = ${temp_max};
          static constexpr float A_START = 135.0f, A_SWEEP = 270.0f;
          auto v2a = [](float v) {
            v = clamp(v, T_MIN, T_MAX);
            return A_START + A_SWEEP * (v - T_MIN) / (T_MAX - T_MIN);
          };
          auto mix = [](lv_color_t a, lv_color_t b, uint8_t t) { return lv_color_mix(a, b, t); };
          const lv_color_t BG = lv_color_hex(0x111A2E);

          std::string action = id(g_hvac_action);
          std::string mode = id(g_hvac_mode);
          lv_color_t mode_color;
          if      (mode == "cool")      mode_color = lv_color_hex(0x27D3FF);
          else if (mode == "heat")      mode_color = lv_color_hex(0xFF9A2E);
          else if (mode == "heat_cool") mode_color = lv_color_hex(0x7EE787);
          else if (mode == "dry")       mode_color = lv_color_hex(0x2FE0C4);
          else if (mode == "fan_only")  mode_color = lv_color_hex(0xEEF3F8);
          else if (mode == "auto")      mode_color = lv_color_hex(0xFFDC5A);
          else                          mode_color = lv_color_hex(0x6A7480);
          lv_color_t accent = id(g_editing) ? lv_color_hex(0xFFD54F) : mode_color;
          bool active = id(g_editing) || action == "heating" || action == "cooling";

          float tgt  = id(g_disp_target);
          float room = id(g_disp_room);

          lv_canvas_fill_bg(id(gauge_canvas), BG, LV_OPA_COVER);
          lv_layer_t layer;
          lv_canvas_init_layer(id(gauge_canvas), &layer);

          lv_draw_arc_dsc_t d;
          lv_draw_arc_dsc_init(&d);
          d.center.x = 120; d.center.y = 120;
          d.radius = 104; d.width = 12; d.rounded = 1;

          // ticks (drawn as 1.5-degree arc slivers on an outer radius)
          for (int tv = (int) T_MIN; tv <= (int) T_MAX; tv++) {
            bool major = (tv % 5) == 0;
            lv_draw_arc_dsc_t tk;
            lv_draw_arc_dsc_init(&tk);
            tk.center.x = 120; tk.center.y = 120;
            tk.radius = 119; tk.width = major ? 12 : 7;
            tk.color = major ? lv_color_hex(0x8B95A2) : lv_color_hex(0x3A4358);
            float a = v2a((float) tv);
            tk.start_angle = a - 0.5f; tk.end_angle = a + 0.5f;
            lv_draw_arc(&layer, &tk);
          }

          // numeric scale labels at major ticks (like the card's 65/70/75...)
          for (int tv = (int) T_MIN; tv <= (int) T_MAX; tv += 5) {
            float a = v2a((float) tv) * (float) M_PI / 180.0f;
            char buf[8];
            snprintf(buf, sizeof(buf), "%d", tv);
            lv_draw_label_dsc_t lb;
            lv_draw_label_dsc_init(&lb);
            lb.font = &lv_font_montserrat_12;
            lb.color = lv_color_hex(0x6A7480);
            lb.text = buf;
            lb.align = LV_TEXT_ALIGN_CENTER;
            int lx = 120 + (int)(86.0f * cosf(a));
            int ly = 120 + (int)(86.0f * sinf(a));
            lv_area_t area = {lx - 14, ly - 7, lx + 14, ly + 7};
            lv_draw_label(&layer, &lb, &area);
          }

          // full track
          d.color = lv_color_hex(0x1D2740); d.opa = LV_OPA_COVER;
          d.start_angle = A_START; d.end_angle = A_START + A_SWEEP;
          lv_draw_arc(&layer, &d);

          if (id(g_online) && tgt > 0) {
            float a_end = v2a(tgt);
            // breathing glow under the mode arc (soft halo, pulses when running)
            float phase = active ? (0.5f + 0.5f * sinf(millis() / 550.0f)) : 0.35f;
            lv_draw_arc_dsc_t g;
            lv_draw_arc_dsc_init(&g);
            g.center.x = 120; g.center.y = 120; g.rounded = 1;
            g.radius = 108; g.width = 22;
            g.color = accent; g.opa = (lv_opa_t)(28 + 40 * phase);
            g.start_angle = A_START; g.end_angle = a_end;
            lv_draw_arc(&layer, &g);

            // gradient mode arc: dark near the scale start -> bright at the tip
            lv_color_t base = mix(accent, BG, 140);            // 55% toward bg
            lv_color_t tip  = mix(lv_color_hex(0xFFFFFF), accent, 90); // lightened
            const int SEGS = 28;
            for (int i = 0; i < SEGS; i++) {
              float f0 = (float) i / SEGS, f1 = (float) (i + 1) / SEGS;
              lv_draw_arc_dsc_t s;
              lv_draw_arc_dsc_init(&s);
              s.center.x = 120; s.center.y = 120;
              s.radius = 104; s.width = 12;
              s.rounded = (i == 0 || i == SEGS - 1) ? 1 : 0;
              s.color = mix(tip, base, (uint8_t)(255 * f1));
              s.opa = LV_OPA_COVER;
              s.start_angle = A_START + (a_end - A_START) * f0;
              s.end_angle   = A_START + (a_end - A_START) * f1 + 0.7f; // overlap: no seams
              lv_draw_arc(&layer, &s);
            }

            // shimmer: a bright pulse travelling along the arc while running
            if (active) {
              float sh = fmodf(millis() / 1800.0f, 1.0f);
              float shc = A_START + (a_end - A_START) * sh;
              lv_draw_arc_dsc_t sm;
              lv_draw_arc_dsc_init(&sm);
              sm.center.x = 120; sm.center.y = 120;
              sm.radius = 104; sm.width = 12; sm.rounded = 1;
              sm.color = mix(lv_color_hex(0xFFFFFF), accent, 150);
              sm.opa = LV_OPA_60;
              sm.start_angle = shc - 7; sm.end_angle = shc + 7;
              if (sm.start_angle >= A_START && sm.end_angle <= a_end)
                lv_draw_arc(&layer, &sm);
            }

            // amber span from setpoint to room temp ("work to do", like the card)
            if (room > 0 && fabsf(room - tgt) > 0.15f) {
              float a_room = v2a(room);
              lv_color_t am0 = lv_color_hex(0xF2933A), am1 = lv_color_hex(0xFFB55E);
              const int RSEG = 14;
              float lo = std::min(a_room, a_end), hi = std::max(a_room, a_end);
              for (int i = 0; i < RSEG; i++) {
                float f0 = (float) i / RSEG, f1 = (float) (i + 1) / RSEG;
                lv_draw_arc_dsc_t s;
                lv_draw_arc_dsc_init(&s);
                s.center.x = 120; s.center.y = 120;
                s.radius = 104; s.width = 8;
                s.rounded = (i == 0 || i == RSEG - 1) ? 1 : 0;
                s.color = mix(am1, am0, (uint8_t)(255 * f1));
                s.opa = LV_OPA_90;
                s.start_angle = lo + (hi - lo) * f0;
                s.end_angle   = lo + (hi - lo) * f1 + 0.7f;
                lv_draw_arc(&layer, &s);
              }
              // white room pointer dot with dark outline (the "80° ROOM" marker)
              lv_draw_arc_dsc_t p;
              lv_draw_arc_dsc_init(&p);
              float pr = 104.0f;
              p.center.x = 120 + (int)(pr * cosf(a_room * (float) M_PI / 180.0f));
              p.center.y = 120 + (int)(pr * sinf(a_room * (float) M_PI / 180.0f));
              p.radius = 8; p.width = 8; p.rounded = 0;
              p.start_angle = 0; p.end_angle = 360;
              p.color = BG; p.opa = LV_OPA_COVER;
              lv_draw_arc(&layer, &p);
              p.radius = 6; p.width = 6;
              p.color = lv_color_hex(0xF2F5F8);
              lv_draw_arc(&layer, &p);
            }

            // bright cap dot at the setpoint tip (the card's teardrop tip)
            lv_draw_arc_dsc_t c;
            lv_draw_arc_dsc_init(&c);
            float cr = 104.0f;
            c.center.x = 120 + (int)(cr * cosf(a_end * (float) M_PI / 180.0f));
            c.center.y = 120 + (int)(cr * sinf(a_end * (float) M_PI / 180.0f));
            c.radius = 9; c.width = 9; c.rounded = 0;
            c.start_angle = 0; c.end_angle = 360;
            c.color = mix(lv_color_hex(0xFFFFFF), accent, 60); c.opa = LV_OPA_COVER;
            lv_draw_arc(&layer, &c);
          }

          lv_canvas_finish_layer(id(gauge_canvas), &layer);
          lv_obj_invalidate(id(gauge_canvas));

